[workspace]
resolver = "2"
members = [
    "crates/model",
    "crates/mailcache",
    "crates/mockcache",
    "crates/suggest",
    "crates/namemap",
    "crates/sieve",
    "bin/mail-util",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
mail-parser = "0.11"
walkdir = "2"
tempfile = "3"
clap = { version = "4", features = ["derive", "env"] }

model = { path = "crates/model" }
mailcache = { path = "crates/mailcache" }
mockcache = { path = "crates/mockcache" }
suggest = { path = "crates/suggest" }
namemap = { path = "crates/namemap" }
sieve = { path = "crates/sieve" }
